<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Dominio canónico: el deploy de Pages (pages.dev) redirige al dominio propio. -->
    <script>
      (function () {
        if (location.hostname === "pedido-wa-track.pages.dev") {
          location.replace("https://lapacho.ar" + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <!-- Login (magic link / OAuth): colapsa "##access_token" a "#access_token" antes de que cargue la app,
         para que Supabase pueda leer el token y crear la sesión. -->
    <script>
      (function () {
        var h = location.hash;
        if (h.length > 1 && h.charAt(1) === "#") {
          var fixed = "#" + h.replace(/^#+/, "");
          history.replaceState(null, "", location.pathname + location.search + fixed);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lapacho">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Lapacho — Los negocios de tu ciudad, en una app</title>
    <meta name="description" content="Pedí comida, farmacia, mercado y más a los negocios de tu ciudad. Elegí, pedí y seguí tu pedido en tiempo real. Simple por naturaleza." />
    <meta name="author" content="Lapacho" />
    <meta name="keywords" content="pedidos, delivery, tienda online, comida, farmacia, mercado, negocios locales, Lapacho" />

    <!-- PWA Manifests -->
    <link rel="manifest" href="/manifest-cliente.json" id="manifest-placeholder">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/lapacho-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/lapacho-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/lapacho-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/lapacho-icon.png">

    <!-- Theme Colors - Rosa Lapacho -->
    <meta name="theme-color" content="#E878A8">
    <meta name="msapplication-TileColor" content="#E878A8">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Lapacho — Los negocios de tu ciudad, en una app" />
    <meta property="og:description" content="Pedí comida, farmacia, mercado y más. Elegí, pedí y seguí tu pedido en tiempo real. Simple por naturaleza." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lapacho.ar/images/hero-poster.jpg" />
    <meta property="og:url" content="https://lapacho.ar" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lapacho — Los negocios de tu ciudad, en una app" />
    <meta name="twitter:description" content="Pedí a los negocios de tu ciudad y seguí tu pedido en tiempo real." />
    <meta name="twitter:image" content="https://lapacho.ar/images/hero-poster.jpg" />

    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registrado:', registration.scope);
            })
            .catch((error) => {
              console.log('Error al registrar Service Worker:', error);
            });
        });
      }

      // Cambiar manifest según la ruta
      function updateManifest() {
        const path = window.location.pathname;
        const manifestLink = document.getElementById('manifest-placeholder');
        const themeColor = document.querySelector('meta[name="theme-color"]');
        
        if (path.includes('/vendor') || path.includes('/dashboard')) {
          manifestLink.href = '/manifest-vendor.json';
          themeColor.content = '#8B5CF6';
        } else if (path.includes('/repartidor')) {
          manifestLink.href = '/manifest-repartidor.json';
          themeColor.content = '#16A34A';
        } else if (path.includes('/soporte')) {
          manifestLink.href = '/manifest-soporte.json';
          themeColor.content = '#0EA5E9';
        } else if (path.includes('/admin')) {
          manifestLink.href = '/manifest-admin.json';
          themeColor.content = '#475569';
        } else {
          // Cliente (tienda, carrito, pedido, mis-pedidos) y landing
          manifestLink.href = '/manifest-cliente.json';
          themeColor.content = '#E878A8';
        }
      }
      
      updateManifest();
      window.addEventListener('popstate', updateManifest);
    </script>
  </body>
</html>
